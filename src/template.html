<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Aster 词航 — 用 DeepSeek 语义批改、智能词卡与学习星图，记住每一个单词。" />
  <title>Aster 词航 · Lexicon Voyage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-style='italic' font-size='38' fill='white' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Instrument Serif"', 'Georgia', 'serif'],
            body: ['Barlow', '"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif']
          },
          borderRadius: {
            DEFAULT: '9999px'
          }
        }
      }
    };
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script>
    /* The UMD build in this pinned release exposes itself as `Motion`. Keep the
       documented alias too, so either global shape works across CDN caches. */
    window.FramerMotion = window.FramerMotion || window.Motion;
    window.Motion = window.FramerMotion || window.Motion;
  </script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --glass-edge: rgba(255, 255, 255, 0.45);
      --hairline: rgba(255, 255, 255, 0.12);
    }

    html {
      scroll-behavior: smooth;
      background: #000;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Barlow, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.26);
      color: #fff;
    }

    button, a, input, textarea, select {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.78);
      outline-offset: 3px;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px) saturate(180%);
      -webkit-backdrop-filter: blur(4px) saturate(180%);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-strong {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border: none;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @supports (backdrop-filter: url(#x)) {
      .liquid-glass-strong {
        backdrop-filter: url(#liquid-refraction) blur(20px) saturate(200%);
        -webkit-backdrop-filter: url(#liquid-refraction) blur(20px) saturate(200%);
      }
    }

    .hero-video-wrap {
      background:
        radial-gradient(circle at 52% 43%, rgba(255,255,255,0.06), transparent 34%),
        #000;
    }

    .fine-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 76%);
      mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 76%);
    }

    .field-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 1.15rem;
      color: #fff;
      transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }
    .field-input::placeholder {
      color: rgba(255, 255, 255, 0.34);
    }
    .field-input:hover {
      border-color: rgba(255, 255, 255, 0.23);
    }
    .field-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.075);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.045);
    }

    textarea.field-input {
      resize: none;
      line-height: 1.65;
    }

    .subtle-rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.22rem;
      height: 1.22rem;
      padding: 0 0.3rem;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 9999px;
      font-family: Barlow, sans-serif;
      font-size: 10px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.68);
      background: rgba(255, 255, 255, 0.055);
    }

    .glass-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.24) transparent;
    }
    .glass-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .glass-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    .glass-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: #fff;
      box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
      animation: statusPulse 2.6s ease-out infinite;
    }
    .status-dot.is-idle {
      background: rgba(255, 255, 255, 0.3);
      animation: none;
      box-shadow: none;
    }

    @keyframes statusPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.32); }
      70% { box-shadow: 0 0 0 7px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    .shimmer-line {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }
    .shimmer-line::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 1.8s infinite;
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .quill {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 400;
    }

    .hero-title {
      text-shadow: 0 8px 60px rgba(0, 0, 0, 0.22);
    }

    .hero-copy {
      text-shadow:
        0 2px 18px rgba(0, 0, 0, 0.72),
        0 1px 4px rgba(0, 0, 0, 0.42);
    }

    .hero-partner-name {
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
    }

    .word-break {
      overflow-wrap: anywhere;
    }

    .hide-scrollbar {
      scrollbar-width: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .input-key {
      font-variant-numeric: tabular-nums;
    }

    .selected-option {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .mono-label {
      font-family: Barlow, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.58);
    }

    .bar-track {
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: #fff;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .status-dot, .shimmer-line::after { animation: none; }
    }

    @media (max-width: 380px) {
      .hero-title { letter-spacing: -2px; }
    }

    .boot-splash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #000;
      color: #fff;
    }
    .boot-mark {
      width: 54px;
      height: 54px;
      border-radius: 9999px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: 32px;
      line-height: 1;
      animation: bootBreathe 2.2s ease-in-out infinite;
    }
    .boot-line {
      width: 84px;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      position: relative;
    }
    .boot-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #fff;
      transform: translateX(-100%);
      animation: bootLine 1.8s ease-in-out infinite;
    }
    .boot-copy {
      font-family: Barlow, "PingFang SC", sans-serif;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
    }
    @keyframes bootBreathe {
      0%, 100% { opacity: 0.5; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes bootLine {
      0% { transform: translateX(-100%); }
      50%, 100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-splash" role="status" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">a</div>
      <div class="boot-line" aria-hidden="true"></div>
      <div class="boot-copy" id="boot-copy">正在准备你的轨道</div>
    </div>
  </div>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("aster-lexicon-voyage:v1");
        var parsed = raw ? JSON.parse(raw) : null;
        var language = parsed && parsed.settings && parsed.settings.language === "en" ? "en" : "zh";
        document.documentElement.lang = language === "en" ? "en" : "zh-CN";
        document.title = language === "en" ? "Aster · Lexicon Voyage" : "Aster 词航 · Lexicon Voyage";
        var copy = document.getElementById("boot-copy");
        if (copy) copy.textContent = language === "en" ? "Preparing your orbit" : "正在准备你的轨道";
        var description = document.querySelector('meta[name="description"]');
        if (description) {
          description.setAttribute("content", language === "en"
            ? "Aster — learn every word with DeepSeek semantic review, smart word cards, and a mastery star map."
            : "Aster 词航 — 用 DeepSeek 语义批改、智能词卡与学习星图，记住每一个单词。");
        }
      } catch (error) {
        /* localStorage may be unavailable; the app will fall back to Chinese. */
      }
    })();
  </script>
  <noscript>
    <div style="min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font-family:sans-serif;padding:2rem;text-align:center">
      需要启用 JavaScript 才能进入 Aster 词航。
    </div>
  </noscript>
  <script type="text/babel" data-presets="react">
/*__APP__*/
  </script>
</body>
</html>
